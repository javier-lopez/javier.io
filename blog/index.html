---
layout: blog
title: "javier.io | Javier López personal blog"
---

{% assign groups = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
{% for group in groups %}
  <section class="year-group">
    <h3 class="year-heading" aria-hidden="true">{{ group.name }}</h3>
    <ul class="post-list">
      {% for post in group.items %}
        {% include post-list-item.html post=post %}
      {% endfor %}
    </ul>
  </section>
{% endfor %}
