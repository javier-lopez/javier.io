<div id="related" aria-label="Related entries">
  <h5>Related Entries:</h5>
  <ul class="post-list">
    {% for post in site.related_posts limit:3 %}
    <li class="post-item">
      <a href="{{ post.url }}">{{ post.title }}</a>
      <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%b %-d, %Y" }}</time>
    </li>
    {% endfor %}
  </ul>
</div>
