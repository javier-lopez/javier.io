    {%- comment -%} ?v= busts browser caches on deploy — stale CSS kept
        shipping old styles to returning visitors (site HTML regenerates,
        stylesheets linger in cache). Vendored fontawesome stays bare so
        the preload in blog.html keeps matching its URL. {%- endcomment -%}
    <link rel="stylesheet" type="text/css" href="/assets/css/default_black.css?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" type="text/css" href="/assets/css/responsive.css?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" type="text/css" href="/assets/css/fontawesome.min.css">
