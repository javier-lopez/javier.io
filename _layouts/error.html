<!DOCTYPE html>
<html>
  <head>
    {% include meta.html %}
    <title>{{ page.title }} | javier.io</title>
    <!-- Preload fontawesome font + stylesheet in parallel so the footer icons
         render the moment the DOM hits them. Without this the first paint shows
         the raw anchors in the site's default red before FA resolves. -->
    <link rel="preload" as="style" href="/assets/css/fontawesome.min.css">
    <link rel="preload" as="font" type="font/woff"
          href="/assets/font/fontawesome-webfont.woff?v=3.2.1" crossorigin>
    <style>
      /* Critical layout — inlined so it applies before the external
         stylesheet chain resolves and stops the first-frame red-icon flash. */
      html { background: #000; }
      body.error-page {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: transparent;
      }
      .warp-bg-canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }
      .error-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
        box-sizing: border-box;
      }
      .error-main > * {
        width: 100%;
        max-width: 720px;
        margin-left: auto;
        margin-right: auto;
      }
      /* Footer uses the site-wide #footer.indexFooter styling (same as index)
         via {% raw %}{% include footer.html case="index.html" %}{% endraw %} in the body. The only bit
         we inline here is the default anchor color so icons don't flash red
         (site default #B03A44) before default_black.css and responsive.css
         settle. */
      #footer.indexFooter a { color: #888; }
    </style>
  </head>

  <body class="error-page">
    {% include warp-bg.html %}

    <main class="error-main">
      {{ content }}
    </main>

    {% include footer.html case="index.html" %}

    <div id="baroque-hint" class="baroqueHint" hidden>click or tap to hear Bach</div>

    <script src="/assets/js/baroque.js"></script>
  </body>
</html>
