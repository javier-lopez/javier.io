domain:      javier.io
title:       "javier.io"
# Full URL with protocol — Jekyll's `absolute_url` filter prepends this to
# every internal link in the atom feed and SEO tags. Edit if you move hosts.
url:         "https://javier.io"
author:      "Javier López"
description: "Javier López personal blog"

twitter:
  username: javier_flpz

source:      .
destination: ./_site
plugins_dir: ./_plugins

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:      [deploy, setup]
safe:        false
future:      true
lsi:         true
highlighter: rouge
markdown:    kramdown
