name: Jekyll build and deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github_pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  archive:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 2

      - name: Snapshot fresh pages in the Wayback Machine
        run: |
          # Save Page Now does not index synchronously: each GET to
          # web.archive.org/save/URL enqueues a capture job the Archive
          # crawls within minutes. Anonymous captures are enough at this
          # scale (~6 concurrent, 10/day per URL); S3 keys from
          # archive.org/account/s3.php raise the limits if this ever 429s.
          #
          # deploy-pages only returns once the deployment is live. The
          # Pages CDN (max-age=600) may still hand the crawler a stale
          # index page for a few minutes — accepted tradeoff to keep this
          # job fast; changed-post URLs are new and never cached.
          urls="https://javier.io/ https://javier.io/blog"
          # Map post files touched by the last commit to their rendered
          # URLs (deletions excluded — no point archiving a fresh 404).
          for f in $(git diff --name-only --diff-filter=d HEAD^ HEAD -- 'blog/*/_posts/*.md' || true); do
            urls="$urls https://javier.io/$(echo "$f" \
              | sed -E 's#^(blog/[a-z]+)/_posts/([0-9]{4})-([0-9]{2})-([0-9]{2})-(.+)\.md$#\1/\2/\3/\4/\5.html#')"
          done

          for url in $urls; do
            echo "queueing capture: $url"
            curl -fsS --retry 3 --retry-delay 60 --retry-all-errors \
              "https://web.archive.org/save/$url" -o /dev/null
          done
